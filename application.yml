spring:
  cloud:
    config:
      enabled: false
    import-check:
      enabled: false

server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    password: "${LAVALINK_PASSWORD:change-me}"
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      repository: "https://maven.lavalink.dev/releases"

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
          - TV
          - WEB
          - MWEB
          - WEBEMBEDDED
          - ANDROID_VR
        oauth:
          enabled: ${YOUTUBE_OAUTH_ENABLED:false}
          refreshToken: ${YOUTUBE_REFRESH_TOKEN:}
logging:
  level:
    root: INFO
    lavalink: INFO

      dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO
